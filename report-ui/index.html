<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="BlindSpot: an AI agent that tries to use your website with only what a screen reader announces, and reports where blind users get stuck." />
    <title>BlindSpot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="#/" aria-label="BlindSpot home">
          <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="9" class="brand-bg" />
            <path d="M5 16s4-7 11-7 11 7 11 7-4 7-11 7S5 16 5 16z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" />
            <circle cx="16" cy="16" r="3.4" fill="#fff" />
            <path d="M7 25 25 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <span class="brand-name">Blind<span>Spot</span></span>
        </a>
        <p class="header-tag">Usability testing through a screen reader's ears</p>
        <span id="fixture-flag" class="badge status-info" hidden>Fixture mode</span>
      </div>
    </header>

    <main id="main" class="wrap" tabindex="-1">
      <noscript><p>BlindSpot's report viewer needs JavaScript.</p></noscript>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>
          BlindSpot never looks at the screen: the agent only gets the browser's accessibility tree, exactly what a screen
          reader announces. Screenshots are shown for sighted humans.
        </p>
      </div>
    </footer>

    <dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-caption">
      <div class="lightbox-inner">
        <div class="lightbox-bar">
          <p id="lightbox-caption" class="lightbox-caption"></p>
          <button type="button" class="btn btn-ghost lightbox-close">Close <kbd aria-hidden="true">Esc</kbd></button>
        </div>
        <img alt="" />
      </div>
    </dialog>
  </body>
</html>
